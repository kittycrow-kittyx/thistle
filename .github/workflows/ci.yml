name: Kernel validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate kernel
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install

      - name: Strict Code Guards
        run: bun run guards

      - name: Type-check kernel
        if: ${{ success() || failure() }}
        run: bun run check

      - name: Test kernel memory
        if: ${{ success() || failure() }}
        run: bun run test:memory

      - name: Test native numeric operations
        if: ${{ success() || failure() }}
        run: bun run test:numeric

      - name: Test native VFS syscalls
        if: ${{ success() || failure() }}
        run: bun run test:vfs

      - name: Test canonical process state and lifetime
        if: ${{ success() || failure() }}
        run: bun run test:process

      - name: Test host capability boundaries
        if: ${{ success() || failure() }}
        run: bun run test:host
